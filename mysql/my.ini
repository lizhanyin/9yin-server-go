# MySQL 免安装配置（九阴服务端专用）
# 使用相对路径: basedir 相对当前工作目录, datadir 相对 basedir。
# 启动MySQL.bat 会用 /D 把工作目录切到本目录, 因此项目整体移动也无需改配置。
[mysqld]
basedir=.
datadir=data
port=3306
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
default-time-zone=+00:00
max_connections=200

[client]
port=3306
default-character-set=utf8mb4
