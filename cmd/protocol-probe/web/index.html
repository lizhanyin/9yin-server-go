<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>九阴 GM · 服务器概览</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d23;
      --card2: #20242c;
      --line: #2a2f3a;
      --accent: #e8b34b;
      --accent2: #4ba3e8;
      --text: #e6e9ef;
      --muted: #8b93a3;
      --ok: #3fbf6f;
      --bad: #6a7283;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font: 14px/1.6 "Segoe UI", system-ui, "Microsoft YaHei", sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: linear-gradient(90deg, #14171d, #1c2027);
      border-bottom: 1px solid var(--line);
      padding: 14px 24px;
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      color: var(--accent);
    }

    header .muted {
      font-size: 12px;
    }

    main {
      max-width: 980px;
      margin: 24px auto;
      padding: 0 20px;
    }

    .srv {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }

    .srv.offline {
      opacity: 0.62;
    }

    .srv-head {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bad);
      flex: none;
    }

    .dot.on {
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
    }

    .srv-name {
      font-weight: 600;
      font-size: 15px;
      flex: 1;
    }

    .srv-addr {
      color: var(--accent2);
      font-size: 12px;
      font-family: Consolas, monospace;
    }

    .srv-stats {
      color: var(--muted);
      font-size: 12px;
      margin: 8px 0 12px;
      min-height: 20px;
    }

    .srv-actions {
      display: flex;
      gap: 8px;
    }

    button {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 13px;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #17130a;
      font-weight: 600;
    }

    button:hover {
      filter: brightness(1.15);
    }

    .players {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .players li {
      display: flex;
      gap: 10px;
      align-items: baseline;
      padding: 6px 4px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .players li:last-child {
      border-bottom: none;
    }

    .players .p-name {
      color: var(--accent);
      font-weight: 600;
      min-width: 90px;
    }

    .players .p-scene {
      color: var(--accent2);
      min-width: 150px;
    }

    .players .p-action {
      color: var(--muted);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>九阴 GM · 服务器概览</h1>
    <span class="muted">当前游戏服（本机 GM 面板），实时轮询在线会话</span>
  </header>
  <main>
    <div class="srv" id="srv-card">
      <div class="srv-head">
        <span class="dot" id="srv-dot"></span>
        <span class="srv-name">九阴当前服</span>
        <span class="srv-addr" id="srv-addr">127.0.0.1:19062</span>
      </div>
      <div class="srv-stats" id="srv-stats">连接中……</div>
      <ul class="players" id="srv-players"></ul>
      <div class="srv-actions">
        <button class="primary" onclick="location.href='console.html'">进入控制台</button>
        <button onclick="refresh()">刷新</button>
      </div>
    </div>
    <p class="hint">
      GM 面板由游戏服进程自带（-gm-listen，默认 127.0.0.1:19062，仅监听本机）；
      命令直接交给在线游戏会话执行，会话忙碌时会报失败，不会排队保留。
    </p>
  </main>
  <script>
    const POLL_MS = 3000;
    let sessions = [];

    document.querySelector("#srv-addr").textContent = location.host || "127.0.0.1:19062";

    async function refresh() {
      let dot = document.querySelector("#srv-dot");
      let stats = document.querySelector("#srv-stats");
      let players = document.querySelector("#srv-players");
      let card = document.querySelector("#srv-card");
      try {
        let r = await fetch("/api/sessions");
        if (!r.ok) throw new Error("HTTP " + r.status);
        sessions = await r.json();
        if (!Array.isArray(sessions)) sessions = [];
      } catch (e) {
        sessions = [];
        dot.classList.remove("on");
        card.classList.add("offline");
        stats.textContent = "面板无法访问 /api/sessions（游戏服是否在运行？）";
        players.innerHTML = "";
        return;
      }
      dot.classList.add("on");
      card.classList.remove("offline");
      stats.textContent =
        "面板在线 · " + sessions.length + " 个在线角色" +
        (sessions.length ? " · 点击「进入控制台」发送 GM 命令" : " —— 先登录游戏");
      players.innerHTML = "";
      for (let s of sessions) {
        let li = document.createElement("li");
        let scene = s.scene && (s.scene.name || s.scene.config);
        li.innerHTML =
          '<span class="p-name"></span>' +
          '<span class="p-scene"></span>' +
          '<span class="p-action"></span>';
        li.querySelector(".p-name").textContent = s.name || "-";
        li.querySelector(".p-scene").textContent = scene || "-";
        li.querySelector(".p-action").textContent =
          "碎银 " + (s.silver != null ? s.silver : "-") +
          " · 怒气 " + (s.sp != null ? s.sp : "-") +
          " · " + (s.lastAction || "-");
        players.appendChild(li);
      }
    }

    refresh();
    setInterval(refresh, POLL_MS);
  </script>
</body>

</html>
